<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="在插画地图上发现一日游路线，把行程带给 AI 继续规划。" />
    <title>Routeo — 发现一条好路线</title>
    <link rel="icon" href="./assets/routeo-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./discovery.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body class="discovery-layout">
    <a class="skip-link" href="#main-content">跳到路线列表</a>
    <div class="app-shell">
      <main class="main-column" id="main-content" tabindex="-1">
        <section class="explore-view" id="explore-view" aria-label="旅行路线探索">
          <header class="discovery-header">
            <div class="topbar">
              <a class="brand" href="#/explore" aria-label="Routeo 首页"><svg class="brand-mark" viewBox="0 0 42 34" aria-hidden="true"><path d="M3 27.5 14.2 8.8c.6-1 2.1-1 2.7 0l5.2 8.5 3.8-6.2c.7-1.1 2.2-1.1 2.9 0l10.2 16.4H3Z" fill="currentColor"/><path d="m9.3 27.5 8.2-13.4 8.2 13.4H9.3Z" fill="var(--canvas)" opacity=".94"/><circle cx="32.1" cy="8.8" r="2.1" fill="currentColor"/></svg><span>Routeo</span></a>
              <form class="search-box" id="search-form" role="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
                <label class="sr-only" for="route-search">搜索城市、景点或路线</label>
                <input id="route-search" type="search" placeholder="想去哪里？搜索城市或景点" autocomplete="off" enterkeyhint="search" />
                <button class="search-clear" id="search-clear" type="button" aria-label="清除搜索" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
              </form>
              <div class="header-actions">
                <button class="header-action" id="mobile-saved" data-nav="saved" type="button" aria-label="查看收藏路线" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 8.8c0 5.1-8.3 11-8.3 11s-8.3-5.9-8.3-11a4.4 4.4 0 0 1 8.3-2 4.4 4.4 0 0 1 8.3 2Z"/></svg>
                  <span class="header-action__label">收藏</span><span class="header-action__count" id="mobile-saved-count" hidden>0</span>
                </button>
                <button class="header-action header-action--more" id="mobile-settings-toggle" type="button" aria-label="更多选项" aria-expanded="false" aria-controls="settings-popover">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
                </button>
                <div class="settings-popover" id="settings-popover" role="region" aria-label="页面偏好" hidden>
                  <p class="settings-popover__title">页面偏好</p>
                  <label class="settings-switch">
                    <span><strong>减少动态效果</strong><small>首次使用时跟随系统设置</small></span>
                    <input id="reduce-motion" type="checkbox" />
                    <span class="switch-track" aria-hidden="true"></span>
                  </label>
                  <p class="settings-footnote">地图为旅行路线示意，请结合实际导航出行。</p>
                </div>
              </div>
            </div>
            <div class="browse-bar">
              <nav class="filter-bar" id="filter-bar" aria-label="按城市筛选">
                <button class="filter-chip is-active" type="button" data-filter="all" data-value="all" aria-pressed="true">全部</button>
              </nav>
              <button class="city-picker-toggle" id="city-picker-toggle" type="button" aria-haspopup="dialog" aria-controls="city-dialog" aria-expanded="false">
                <span id="city-picker-label">所有城市</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
              </button>
            </div>
          </header>
          <div class="feed-heading" id="feed-heading">
            <h1 id="feed-title">发现一条好路线</h1>
            <div class="feed-heading__tools"><button class="clear-selection" id="clear-selection" type="button" hidden>清除筛选</button><span class="feed-count" id="feed-count">— 条路线</span></div>
          </div>
          <div class="route-feed" id="route-feed" aria-live="polite" aria-busy="false"></div>
          <div class="empty-state" id="empty-state" hidden>
            <svg viewBox="0 0 58 58" aria-hidden="true"><path d="M10 42 23 16l8 15 5-9 12 20H10Z"/><path d="M16 42c7-7 13-7 20 0"/></svg>
            <h2 id="empty-title">还没有找到这条路线</h2>
            <p id="empty-description">换个城市或景点关键词试试。</p>
            <button class="reset-button" id="reset-filters" type="button">查看全部路线</button>
          </div>
          <footer class="page-footer">
            <span>走慢一点，风景会追上来。</span><span>Routeo</span>
          </footer>
        </section>
        <section class="story-view" id="story-view" aria-label="路线故事" hidden></section>
      </main>
    </div>
    <dialog class="discovery-dialog city-dialog" id="city-dialog" aria-labelledby="city-dialog-title">
      <header class="discovery-dialog__header">
        <div><h2 id="city-dialog-title">想去哪个城市？</h2><p>从一条一日游路线开始</p></div>
        <button class="dialog-close" type="button" data-close-dialog="city-dialog" aria-label="关闭城市选择"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="city-grid" id="city-grid" role="group" aria-label="选择城市"></div>
    </dialog>
    <dialog class="discovery-dialog itinerary-dialog" id="itinerary-dialog" aria-labelledby="itinerary-dialog-title">
      <header class="discovery-dialog__header">
        <div><p id="itinerary-dialog-city"></p><h2 id="itinerary-dialog-title">行程预览</h2></div>
        <button class="dialog-close" type="button" data-close-dialog="itinerary-dialog" aria-label="关闭行程预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </header>
      <ol class="itinerary-preview" id="itinerary-preview"></ol>
      <a class="itinerary-dialog__open" id="itinerary-dialog-open" href="#/explore">打开路线地图<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
